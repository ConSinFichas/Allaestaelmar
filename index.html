<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Con Sin Fichas - Arcade</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0; padding: 10px; background: #121212; color: #fff;
      font-family: monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .gameboy-casing {
      width: 100%; max-width: 360px; background: #2b2b2b; border-radius: 20px;
      padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.1);
      border: 2px solid #3d3d3d; display: flex; flex-direction: column; gap: 12px;
    }
    .player-section {
      background: #1e1e1e; padding: 10px; border-radius: 10px; border: 1px solid #333; text-align: center;
    }
    .track-title { font-size: 11px; color: #00ffcc; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    audio { width: 100%; height: 32px; outline: none; }
    
    .screen-frame {
      background: #000; border-radius: 8px; padding: 8px; border: 3px solid #111;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.9); text-align: center; position: relative;
    }
    canvas { background: #050505; border-radius: 4px; width: 100%; height: auto; display: block; image-rendering: pixelated; }
    
    .brand { text-align: center; font-weight: bold; font-size: 14px; letter-spacing: 2px; color: #888; text-transform: uppercase; }
    
    .controls-section { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; }
    
    /* D-Pad Layout */
    .dpad { display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 2px; }
    .btn-pad { background: #444; border: 1px solid #222; border-radius: 4px; box-shadow: 0 3px 0 #111; color: #aaa; font-weight: bold; display: flex; justify-content: center; align-items: center; user-select: none; }
    .btn-pad:active { background: #222; transform: translateY(2px); box-shadow: 0 1px 0 #111; }
    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 3; }
    
    /* Action Buttons (A/B) */
    .action-buttons { display: flex; gap: 12px; transform: rotate(-10deg); }
    .btn-action {
      width: 48px; height: 48px; background: #c0392b; border: 2px solid #7f8c8d; border-radius: 50%;
      color: #fff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 0 #78281f;
      display: flex; justify-content: center; align-items: center; user-select: none;
    }
    .btn-action:active { background: #922b21; transform: translateY(3px); box-shadow: 0 1px 0 #78281f; }
    .btn-action.b { transform: translateY(10px); background: #d35400; box-shadow: 0 4px 0 #873600; }
  </style>
</head>
<body>

<div class="gameboy-casing">
  <!-- Reproductor e Info -->
  <div class="player-section">
    <div id="trackTitle" class="track-title">Cargando canción...</div>
    <audio id="audioPlayer" controls src=""></audio>
  </div>

  <!-- Pantalla del Juego -->
  <div class="screen-frame">
    <canvas id="gameCanvas" width="320" height="220"></canvas>
  </div>

  <div class="brand">CON SIN FICHAS</div>

  <!-- Controles -->
  <div class="controls-section">
    <div class="dpad">
      <div class="btn-pad up" id="btnUp">▲</div>
      <div class="btn-pad left" id="btnLeft">◄</div>
      <div class="btn-pad right" id="btnRight">►</div>
      <div class="btn-pad down" id="btnDown">▼</div>
    </div>
    <div class="action-buttons">
      <div class="btn-action b" id="btnB">B</div>
      <div class="btn-action a" id="btnA">A</div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const audioPlayer = document.getElementById('audioPlayer');
  const trackTitle = document.getElementById('trackTitle');

  let gameState = 'STOPPED'; // STOPPED, PLAYING, PAUSED
  let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, KeyA: false, KeyB: false };

  // 1. Carga Dinámica desde config.json
  async function loadConfiguration() {
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('juego') || 'default';

    try {
      const response = await fetch('config.json');
      const config = await response.json();
      const currentGameData = config[gameId] || config['default'];

      if (currentGameData) {
        audioPlayer.src = currentGameData.audioPath || 'audios/cancion1.mp3';
        trackTitle.innerText = `🎵 ${currentGameData.title || 'Con Sin Fichas'}`;
      }
    } catch (e) {
      console.warn("No se pudo cargar config.json, usando valores por defecto.", e);
      audioPlayer.src = 'audios/cancion1.mp3';
      trackTitle.innerText = "🎵 Con Sin Fichas - Canción 1";
    }
  }

  // 2. Controladores de Audio sincrónicos con el juego
  audioPlayer.addEventListener('play', () => { gameState = 'PLAYING'; });
  audioPlayer.addEventListener('pause', () => { gameState = 'PAUSED'; });
  audioPlayer.addEventListener('ended', () => { gameState = 'STOPPED'; });

  // 3. Mapeo de Controles (Teclado y Touch)
  function bindTouch(elementId, keyName) {
    const el = document.getElementById(elementId);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    el.addEventListener('mousedown', () => { keys[keyName] = true; });
    el.addEventListener('mouseup', () => { keys[keyName] = false; });
  }

  bindTouch('btnUp', 'ArrowUp');
  bindTouch('btnDown', 'ArrowDown');
  bindTouch('btnLeft', 'ArrowLeft');
  bindTouch('btnRight', 'ArrowRight');
  bindTouch('btnA', 'KeyA');
  bindTouch('btnB', 'KeyB');

  window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

  // 4. Lógica y Render del Juego (Ejemplo base/demostración)
  let player = { x: 150, y: 160, size: 20, speed: 3 };

  function update() {
    if (gameState !== 'PLAYING') return;

    if (keys.ArrowLeft && player.x > 0) player.x -= player.speed;
    if (keys.ArrowRight && player.x < canvas.width - player.size) player.x += player.speed;
    if (keys.ArrowUp && player.y > 0) player.y -= player.speed;
    if (keys.ArrowDown && player.y < canvas.height - player.size) player.y += player.speed;
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'STOPPED' || gameState === 'PAUSED') {
      ctx.fillStyle = '#00ffcc';
      ctx.font = '14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PRESS PLAY TO START', canvas.width / 2, canvas.height / 2);
      return;
    }

    // Render del jugador
    ctx.fillStyle = keys.KeyA ? '#ff0055' : '#00ffcc';
    ctx.fillRect(player.x, player.y, player.size, player.size);
  }

  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  // Inicialización
  loadConfiguration();
  gameLoop();
</script>
</body>
</html>
