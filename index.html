<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSF - Surf Rider</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background-color: #030b14;
            color: #00d9ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(0, 217, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 217, 255, 0.05) 1px, transparent 1px);
            background-size: 25px 25px;
            overflow: hidden;
        }

        #console {
            width: 95%;
            max-width: 420px;
            height: 85vh;
            max-height: 820px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid #00d9ff;
            padding: 15px 18px;
            background-color: #05101d;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 217, 255, 0.3), inset 0 0 15px rgba(0, 217, 255, 0.1);
        }

        #music-player {
            border: 1px solid #00d9ff;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 217, 255, 0.03);
            box-shadow: 0 0 5px rgba(0, 217, 255, 0.1) inset;
        }

        #play-btn-box {
            border: 1px solid #00d9ff;
            border-radius: 4px;
            width: 32px; height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(0, 217, 255, 0.1);
        }

        .play-icon {
            width: 0; height: 0; 
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 8px solid #00d9ff;
            transition: all 0.2s;
            margin-left: 2px;
        }
        .play-icon.playing {
            border-top: none; border-bottom: none; border-left: 2.5px solid #00d9ff;
            border-right: 2.5px solid #00d9ff;
            width: 8px; height: 10px;
            background: transparent;
            margin-left: 0;
        }

        .track-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .track-name {
            font-size: 9px;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        .track-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .track-progress {
            width: 0%;
            height: 100%;
            background: #00d9ff;
            transition: width 0.1s linear;
        }

        #game-screen {
            border: 2px solid #00d9ff;
            width: 100%;
            aspect-ratio: 600 / 480;
            height: auto;
            background-color: #01060c;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.2) inset;
            cursor: pointer;
            touch-action: none;
        }
        canvas { display: block; width: 100%; height: 100%; }

        .brand-title {
            text-align: center; font-size: 13px; 
            letter-spacing: 3px; color: #00d9ff;
            text-shadow: 0 0 8px rgba(0, 217, 255, 0.5);
        }

        #controls-area {
            display: flex; justify-content: space-between; align-items: center; 
        }

        .d-pad { position: relative; width: 105px; height: 105px; }
        .d-btn {
            position: absolute; background: rgba(0, 217, 255, 0.05);
            border: 1px solid #00d9ff; display: flex; justify-content: center; align-items: center;
            color: #00d9ff; font-size: 13px; box-shadow: 0 0 5px rgba(0, 217, 255, 0.2);
        }
        .d-up { top: 0; left: 34px; width: 37px; height: 37px; border-bottom: none; border-radius: 4px 4px 0 0; }
        .d-down { bottom: 0; left: 34px; width: 37px; height: 37px; border-top: none; border-radius: 0 0 4px 4px; }
        .d-left { top: 34px; left: 0; width: 37px; height: 37px; border-right: none; border-radius: 4px 0 0 4px; }
        .d-right { top: 34px; right: 0; width: 37px; height: 37px; border-left: none; border-radius: 0 4px 4px 0; }
        .d-center { top: 34px; left: 34px; width: 37px; height: 37px; border: 1px solid #00d9ff; background: rgba(0, 217, 255, 0.15); }

        .action-container { display: flex; gap: 16px; align-items: flex-end; }
        .action-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .action-btn {
            width: 55px; height: 55px; border-radius: 50%;
            border: 2px solid #00d9ff; background: rgba(0, 217, 255, 0.08);
            color: #00d9ff; font-size: 18px; font-weight: bold; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.3); transition: background 0.1s;
        }
        .action-btn:active { background: rgba(0, 217, 255, 0.3); box-shadow: 0 0 15px rgba(0, 217, 255, 0.6); }
        .action-label { font-size: 9px; letter-spacing: 1px; color: #00d9ff; }
        #group-b { margin-bottom: 20px; }

        .footer-shortcuts {
            display: flex; justify-content: space-between; font-size: 8px;
            color: rgba(0, 217, 255, 0.6); border-top: 1px dashed rgba(0, 217, 255, 0.2); padding-top: 8px;
        }
    </style>
</head>
<body>

<div id="console">
    <div id="music-player">
        <div id="play-btn-box" onclick="togglePauseButton()">
            <div class="play-icon" id="play-icon"></div>
        </div>
        <div class="track-info">
            <div class="track-name" id="track-title">CARGANDO...</div>
            <div class="track-bar-container">
                <div class="track-progress" id="track-progress"></div>
            </div>
        </div>
    </div>

    <div id="game-screen">
        <canvas id="gameCanvas" width="600" height="230"></canvas>
    </div>

    <div class="brand-title" id="brand-title-text">
        〰️ Con Sin Fichas 〰️
    </div>

    <div id="controls-area">
        <div class="d-pad">
            <div class="d-btn d-up">▲</div>
            <div class="d-btn d-left">◀</div>
            <div class="d-btn d-center"></div>
            <div class="d-btn d-right">▶</div>
            <div class="d-btn d-down">▼</div>
        </div>
        
        <div class="action-container">
            <div class="action-group" id="group-b">
                <div class="action-btn" id="btn-b">B</div>
                <span class="action-label">AGACHAR</span>
            </div>
            <div class="action-group" id="group-a">
                <div class="action-btn" id="btn-a">A</div>
                <span class="action-label">SALTO</span>
            </div>
        </div>
    </div>

    <div class="footer-shortcuts">
        <span>⌨ Pantalla / A / Espacio: Salto o Start</span>
        <span>B / S / Abajo: Agachar / Drop</span>
    </div>
</div>

<script>
    let gameConfig = {};
    let audioElement = null;
    let musicInterval;
    let isPlaying = false;
    let trackProgressPercent = 0;
    const images = {};

    function loadConfigAndAssets() {
        fetch('config.json?v=' + Date.now())
            .then(res => res.json())
            .then(config => {
                gameConfig = config;
                document.getElementById('track-title').innerText = `${config.audio.trackName} [ ⚡ 1.0x ]`;
                document.getElementById('brand-title-text').innerText = `〰️ ${config.gameTitle} 〰️`;
                
                audioElement = new Audio(config.audio.file);
                audioElement.loop = true;
                audioElement.load();
                
                audioElement.addEventListener('canplaythrough', () => {
                    if (userWantsToPlay && !isPlaying && !isPaused) {
                        startMusicLoop();
                    }
                });

                audioElement.onerror = () => {
                    console.warn("Aviso: El archivo de audio no pudo cargarse, el juego continuará sin sonido.");
                };

                loadImages(config.assets, () => {
                    surfer.draw();
                    drawScenery();
                    ctx.fillStyle = '#00d9ff';
                    ctx.font = 'bold 14px Courier New';
                    ctx.fillText('Toca el Play, la pantalla o A para iniciar', 115, 115);
                    gameOver = true;
                    frames = 0;
                });
            })
            .catch(err => {
                console.error("Error al cargar config.json.", err);
            });
    }

    function loadImages(assetsObj, callback) {
        let keys = Object.keys(assetsObj);
        let loaded = 0;
        keys.forEach(key => {
            images[key] = new Image();
            images[key].src = assetsObj[key];
            images[key].onload = () => {
                loaded++;
                if (loaded === keys.length) callback();
            };
            images[key].onerror = () => {
                console.warn(`No se pudo cargar la imagen: ${assetsObj[key]}`);
                loaded++;
                if (loaded === keys.length) callback();
            };
        });
    }

    function startMusicLoop() {
        if (!audioElement) return;
        
        audioElement.play().then(() => {
            isPlaying = true;
            document.getElementById('play-icon').classList.add('playing');
        }).catch(e => {
            console.log("Audio esperando interacción o carga:", e);
        });
        
        clearInterval(musicInterval);
        musicInterval = setInterval(() => {
            if (audioElement && audioElement.duration && !isNaN(audioElement.duration)) {
                trackProgressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                document.getElementById('track-progress').style.width = trackProgressPercent + '%';
            }
        }, 200);
    }

    function stopMusicLoop() {
        if (audioElement) {
            try { audioElement.pause(); } catch(e) {}
        }
        isPlaying = false;
        clearInterval(musicInterval);
        document.getElementById('play-icon').classList.remove('playing');
    }

    let isPaused = false;
    let gameOver = true;
    let userWantsToPlay = false;

    function togglePauseButton() {
        if (isPaused) {
            resumeGame();
        } else if (gameOver) {
            resetGame();
        } else {
            pauseGame();
        }
    }

    function pauseGame() {
        if (gameOver) return;
        isPaused = true;
        stopMusicLoop();
        cancelAnimationFrame(animationFrameId);
        drawPauseScreen();
    }

    function resumeGame() {
        isPaused = false;
        startMusicLoop();
        startGameLoop();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let frames = 0;
    let score = 0;
    let hiScore = 1250; 
    let nextSpeedUpThreshold = 250;
    let gameSpeed = 4.5;
    let animationFrameId;
    let obstacles = [];
    let coins = [];

    const surfer = {
        x: 60,
        y: 338,
        width: 68,
        height: 72,
        normalHeight: 72,
        duckWidth: 51
        duckHeight: 54,
        vy: 0,
        gravity: 0.9,
        jumpPower: -16.5,
        isGrounded: true,
        isDucking: false,

        update: function() {
            this.y += this.vy;
            if (!this.isGrounded) {
                this.vy += this.gravity;
            }

            let groundLevel = 410 - (this.isDucking ? this.duckHeight : this.normalHeight);
            if (this.y >= groundLevel) {
                this.y = groundLevel;
                this.vy = 0;
                this.isGrounded = true;
            }
        },

        draw: function() {
            ctx.save();
            let currentW = this.isDucking ? this.duckWidth : this.normalWidth;
            let currentH = this.isDucking ? this.duckHeight : this.normalHeight;

            if (images.surfer && images.surfer.complete && images.surfer.naturalWidth > 0) {
                ctx.drawImage(images.surfer, this.x, this.y, currentW, currentH);
            } else {
                ctx.font = `${currentH}px sans-serif`;
                ctx.textBaseline = 'top';
                ctx.fillText('🏄', this.x, this.y - 8);
            }
            ctx.restore();
        },

        jump: function() {
            if (this.isGrounded && !this.isDucking) {
                this.vy = this.jumpPower;
                this.isGrounded = false;
            }
        },

        duck: function(state) {
            if (state && !this.isGrounded) {
                this.vy += 15; 
            }
            if (this.isGrounded) {
                this.isDucking = state;
                if (state) {
                    this.y += (this.normalHeight - this.duckHeight);
                }
            }
        }
    };

    class Obstacle {
        constructor() {
            this.x = canvas.width;
            this.type = Math.random() > 0.4 ? 'bird' : 'rock';
            this.width = this.type === 'bird' ? 56 : 52;
            this.height = this.type === 'bird' ? 40 : 52;
            
            if (this.type === 'bird') {
                this.y = Math.random() > 0.5 ? 310 : 260;
            } else {
                this.y = 410 - this.height;
            }
        }
        update() { this.x -= gameSpeed; }
        draw() {
            let imgKey = this.type === 'bird' ? 'bird' : 'rock';
            if (images[imgKey] && images[imgKey].complete && images[imgKey].naturalWidth > 0) {
                ctx.drawImage(images[imgKey], this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = '#ff3366';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }
    }

    class Coin {
        constructor() {
            this.x = canvas.width;
            this.y = Math.random() > 0.5 ? 280 : 350;
            this.width = 48;  // Escalado 2x
            this.height = 48; // Escalado 2x
        }
        update() { this.x -= gameSpeed; }
        draw() {
            if (images.coin && images.coin.complete && images.coin.naturalWidth > 0) {
                ctx.drawImage(images.coin, this.x, this.y, this.width, this.height);
            } else {
                ctx.font = '44px sans-serif';
                ctx.textBaseline = 'top';
                ctx.fillText('🪙', this.x, this.y);
            }
        }
    }

    function resetGame() {
        obstacles = [];
        coins = [];
        score = 0;
        nextSpeedUpThreshold = 250;
        gameSpeed = 4.5;
        if (gameConfig.audio) {
            document.getElementById('track-title').innerText = `${gameConfig.audio.trackName} [ ⚡ 1.0x ]`;
        }
        gameOver = false;
        isPaused = false;
        frames = 1;
        
        startMusicLoop();
        startGameLoop();
    }

    function startGameLoop() {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        gameLoop();
    }

    function drawScenery() {
        ctx.fillStyle = '#ff8c00';
        ctx.beginPath();
        ctx.arc(520, 55, 25, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(0, 217, 255, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, 180 + Math.sin(frames * 0.05) * 4);
        for(let i=0; i<canvas.width; i+=20) {
            ctx.lineTo(i, 180 + Math.sin((frames + i) * 0.05) * 4);
        }
        ctx.stroke();

        ctx.fillStyle = '#02182b';
        ctx.fillRect(0, 195, canvas.width, 40);
        ctx.strokeStyle = '#00d9ff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 195); ctx.lineTo(canvas.width, 195);
        ctx.stroke();

        ctx.fillStyle = '#00d9ff';
        ctx.font = 'bold 12px Courier New';
        let hiStr = String(Math.floor(hiScore)).padStart(5, '0');
        let scoreStr = String(Math.floor(score)).padStart(5, '0');
        ctx.fillText(`HI ${hiStr}    SCORE ${scoreStr}`, 235, 25);
    }

    function drawPauseScreen() {
        ctx.fillStyle = 'rgba(1, 6, 12, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#00d9ff';
        ctx.font = 'bold 24px Courier New';
        ctx.fillText('PAUSA', 265, 100);
    }

    function gameLoop() {
        if (isPaused) return; 

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawScenery();
        surfer.update();
        surfer.draw();

        if (frames % Math.max(65, 120 - Math.floor(gameSpeed*5)) === 0) obstacles.push(new Obstacle());
        if (frames % 85 === 0) coins.push(new Coin());

        for (let i = 0; i < obstacles.length; i++) {
            let obs = obstacles[i];
            obs.update();
            obs.draw();

            let currentH = surfer.isDucking ? surfer.duckHeight : surfer.normalHeight;
            let currentW = surfer.isDucking ? surfer.height : surfer.width;
            
            if (
                surfer.x + 5 < obs.x + obs.width &&
                surfer.x + currentW - 5 > obs.x &&
                surfer.y + 5 < obs.y + obs.height &&
                surfer.y + currentH - 5 > obs.y
            ) {
                gameOver = true;
            }

            if (obs.x + obs.width < 0) { obstacles.splice(i, 1); i--; }
        }

        for (let i = 0; i < coins.length; i++) {
            let c = coins[i];
            c.update();
            c.draw();

            let currentH = surfer.isDucking ? surfer.duckHeight : surfer.normalHeight;
            let currentW = surfer.isDucking ? surfer.height : surfer.width;

            if (
                surfer.x < c.x + c.width &&
                surfer.x + currentW > c.x &&
                surfer.y < c.y + c.height &&
                surfer.y + currentH > c.y
            ) {
                score += 50; 
                coins.splice(i, 1);
                i--;
            } else if (c.x + c.width < 0) {
                coins.splice(i, 1);
                i--;
            }
        }

        if (gameOver) {
            if (score > hiScore) hiScore = Math.floor(score);
            ctx.fillStyle = 'rgba(1, 6, 12, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ff3366';
            ctx.font = 'bold 24px Courier New';
            ctx.fillText('GAME OVER', 225, 100);
            
            ctx.fillStyle = '#00d9ff';
            ctx.font = '13px Courier New';
            ctx.fillText('Toca la pantalla o Presiona A para reiniciar', 110, 135);
            
            return; 
        }

        frames++;
        score += (gameSpeed / 15); 
        
        if (score >= nextSpeedUpThreshold) {
            gameSpeed += 0.5;
            nextSpeedUpThreshold += 250;
            let displaySpeed = 1.0 + ((gameSpeed - 4.5) / 5);
            if (gameConfig.audio) {
                document.getElementById('track-title').innerText = `${gameConfig.audio.trackName} [ ⚡ ${displaySpeed.toFixed(1)}x ]`;
            }
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    }

    function handleActionA(e) {
        userWantsToPlay = true;
        
        if (audioElement) {
            audioElement.play().then(() => {
                isPlaying = true;
                document.getElementById('play-icon').classList.add('playing');
            }).catch(err => {
                console.log("Audio esperando descarga completa:", err);
            });
        }

        if(e) e.preventDefault();
        
        if (isPaused) {
            resumeGame();
        } else if (gameOver) {
            resetGame();
        } else {
            surfer.jump();
        }
    }

    document.getElementById('game-screen').addEventListener('mousedown', handleActionA);
    document.getElementById('game-screen').addEventListener('touchstart', handleActionA, {passive: false});

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') handleActionA(e);
        if (e.code === 'ArrowDown' || e.code === 'KeyB' || e.code === 'KeyS') {
            if(!gameOver && !isPaused) surfer.duck(true);
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowDown' || e.code === 'KeyB' || e.code === 'KeyS') surfer.duck(false);
    });

    const btnA = document.getElementById('btn-a');
    const btnB = document.getElementById('btn-b');

    btnA.addEventListener('touchstart', handleActionA, {passive: false});
    btnA.addEventListener('mousedown', handleActionA);

    btnB.addEventListener('touchstart', (e) => { e.preventDefault(); if(!gameOver && !isPaused) surfer.duck(true); }, {passive: false});
    btnB.addEventListener('touchend', (e) => { e.preventDefault(); if(!isPaused) surfer.duck(false); }, {passive: false});
    btnB.addEventListener('mousedown', () => { if(!gameOver && !isPaused) surfer.duck(true); });
    btnB.addEventListener('mouseup', () => { if(!isPaused) surfer.duck(false); });
    btnB.addEventListener('mouseleave', () => { if(!isPaused) surfer.duck(false); });

    loadConfigAndAssets();
</script>
</body>
</html>
