<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Con Sin Fichas - Surf Runner</title>
  <style>
    :root {
      --chasis-color: #031e2e;
      --borde-color: #00f2fe;
      --fondo-canvas: #020b14;
      --texto-color: #ffffff;
      --neon-yellow: #ffee00;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #010810;
      color: var(--texto-color);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* Chasis GameBoy Océano */
    .gameboy-casing {
      width: 100%;
      max-width: 360px;
      border: 3px solid var(--borde-color);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--chasis-color);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.3), inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .player-section {
      width: 100%;
      margin-bottom: 10px;
      text-align: center;
    }

    .song-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--borde-color);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 5px var(--borde-color);
    }

    audio {
      width: 100%;
      height: 32px;
      filter: invert(1) hue-rotate(140deg);
    }

    .screen-frame {
      width: 100%;
      border: 2px solid var(--borde-color);
      border-radius: 6px;
      background-color: var(--fondo-canvas);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.2);
      cursor: pointer;
    }

    canvas {
      width: 100%;
      height: 220px;
      display: block;
      background-color: transparent;
    }

    .brand {
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 12px 0;
      text-align: center;
      color: var(--neon-yellow);
      text-shadow: 0 0 8px var(--neon-yellow);
    }

    .controls-section {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px;
    }

    /* D-Pad */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 38px);
      grid-template-rows: repeat(3, 38px);
    }

    .dpad-btn {
      background: #011422;
      border: 2px solid var(--borde-color);
      color: var(--borde-color);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      box-shadow: 0 0 5px rgba(0, 242, 254, 0.3);
      cursor: pointer;
    }

    .dpad-btn:active {
      background: var(--borde-color);
      color: #000000;
    }

    .up { grid-column: 2; grid-row: 1; border-radius: 4px 4px 0 0; }
    .left { grid-column: 1; grid-row: 2; border-radius: 4px 0 0 4px; }
    .center { grid-column: 2; grid-row: 2; background: #000; border: none; }
    .right { grid-column: 3; grid-row: 2; border-radius: 0 4px 4px 0; }
    .down { grid-column: 2; grid-row: 3; border-radius: 0 0 4px 4px; }

    /* Botones A / B */
    .action-buttons {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-round {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #011422;
      border: 2px solid var(--borde-color);
      color: var(--borde-color);
      font-size: 1rem;
      font-weight: bold;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
      cursor: pointer;
    }

    .btn-round:active {
      background: var(--borde-color);
      color: #000000;
    }

    .btn-a { margin-top: -15px; }
    .btn-b { margin-top: 10px; }
  </style>
</head>
<body>

  <div class="gameboy-casing">
    
    <div class="player-section">
      <div class="song-title" id="songTitle">🏄 SURF RUNNER 🏄‍♂️</div>
      <!-- Nombre de archivo fijado a cancion1.mp3 -->
      <audio id="audioPlayer" controls src="cancion1.mp3"></audio>
    </div>

    <div class="screen-frame" id="screenFrame">
      <canvas id="gameCanvas" width="320" height="220"></canvas>
    </div>

    <div class="brand">Con Sin Fichas</div>

    <div class="controls-section">
      <div class="dpad">
        <button class="dpad-btn up" id="btnUp">▲</button>
        <button class="dpad-btn left" id="btnLeft">◄</button>
        <div class="center"></div>
        <button class="dpad-btn right" id="btnRight">►</button>
        <button class="dpad-btn down" id="btnDown">▼</button>
      </div>

      <div class="action-buttons">
        <button class="btn-round btn-b" id="btnB">B</button>
        <button class="btn-round btn-a" id="btnA">A</button>
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const audioPlayer = document.getElementById('audioPlayer');
    const screenFrame = document.getElementById('screenFrame');

    let gameRunning = false;
    let distance = 0;
    let highScore = localStorage.getItem('surf_high_score') || 0;
    let frameCount = 0;
    let gameSpeed = 3.5;

    const WATER_LEVEL = 160;

    const surfer = {
      x: 40,
      y: WATER_LEVEL,
      vy: 0,
      gravity: 0.55,
      jumpForce: -10.5,
      isJumping: false,
      isDucking: false,
      duckTimer: 0,
      width: 24,
      height: 32
    };

    let obstacles = [];
    let foamParticles = [];
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(freq, duration, type = 'sine', slideFreq = null) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideFreq) {
          osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
        }
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function startGame() {
      initAudio();
      if (!gameRunning) {
        resetGame();
        gameRunning = true;
        audioPlayer.play().catch(() => {
          console.log("Audio no disponible o bloqueado por el navegador.");
        });
        gameLoop();
      }
    }

    function jump() {
      if (!gameRunning) {
        startGame();
        return;
      }
      if (!surfer.isJumping) {
        surfer.vy = surfer.jumpForce;
        surfer.isJumping = true;
        surfer.isDucking = false;
        playSound(300, 0.15, 'square', 600);
      }
    }

    function duck() {
      if (!gameRunning) {
        startGame();
        return;
      }
      if (surfer.isJumping) {
        surfer.vy += 7;
      } else {
        surfer.isDucking = true;
        surfer.duckTimer = 25;
        playSound(200, 0.1, 'sawtooth', 100);
      }
    }

    function bindAction(id, actionFn) {
      const btn = document.getElementById(id);
      const trigger = (e) => {
        e.preventDefault();
        actionFn();
      };
      btn.addEventListener('touchstart', trigger, { passive: false });
      btn.addEventListener('mousedown', trigger);
    }

    bindAction('btnA', jump);
    bindAction('btnUp', jump);
    bindAction('btnB', duck);
    bindAction('btnDown', duck);

    screenFrame.addEventListener('click', () => {
      if (!gameRunning) startGame();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') jump();
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') duck();
    });

    audioPlayer.addEventListener('play', () => {
      if (!gameRunning) startGame();
    });

    function resetGame() {
      distance = 0;
      gameSpeed = 3.5;
      frameCount = 0;
      obstacles = [];
      foamParticles = [];
      surfer.y = WATER_LEVEL;
      surfer.vy = 0;
      surfer.isJumping = false;
      surfer.isDucking = false;
    }

    function spawnObstacle() {
      const isFlying = Math.random() < 0.35;
      if (isFlying) {
        obstacles.push({
          x: canvas.width + 20,
          y: WATER_LEVEL - 38,
          type: '🐦',
          isFlying: true,
          width: 22,
          height: 20
        });
      } else {
        const seaHazards = ['🦈', '🪨', '🛟'];
        const hazard = seaHazards[Math.floor(Math.random() * seaHazards.length)];
        obstacles.push({
          x: canvas.width + 20,
          y: WATER_LEVEL - 5,
          type: hazard,
          isFlying: false,
          width: 22,
          height: 22
        });
      }
    }

    function update() {
      frameCount++;
      distance += 0.15;
      gameSpeed = 3.5 + Math.floor(distance / 50) * 0.3;

      if (surfer.isJumping) {
        surfer.y += surfer.vy;
        surfer.vy += surfer.gravity;

        if (surfer.y >= WATER_LEVEL) {
          surfer.y = WATER_LEVEL;
          surfer.vy = 0;
          surfer.isJumping = false;
        }
      }

      if (surfer.isDucking) {
        surfer.duckTimer--;
        if (surfer.duckTimer <= 0) {
          surfer.isDucking = false;
        }
      }

      if (frameCount % 3 === 0) {
        foamParticles.push({
          x: surfer.x - 5,
          y: surfer.y + 10,
          size: Math.random() * 4 + 2,
          speed: gameSpeed * 0.8,
          life: 15
        });
      }

      for (let i = foamParticles.length - 1; i >= 0; i--) {
        const p = foamParticles[i];
        p.x -= p.speed;
        p.life--;
        if (p.life <= 0) {
          foamParticles.splice(i, 1);
        }
      }

      const spawnInterval = Math.max(45, Math.floor(90 - gameSpeed * 5));
      if (frameCount % spawnInterval === 0) {
        spawnObstacle();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= gameSpeed;

        const surferHitbox = {
          x: surfer.x - 10,
          y: surfer.isDucking ? surfer.y - 12 : surfer.y - 28,
          width: 20,
          height: surfer.isDucking ? 14 : 28
        };

        const obstacleHitbox = {
          x: obs.x - 10,
          y: obs.y - 15,
          width: obs.width,
          height: obs.height
        };

        if (
          surferHitbox.x < obstacleHitbox.x + obstacleHitbox.width &&
          surferHitbox.x + surferHitbox.width > obstacleHitbox.x &&
          surferHitbox.y < obstacleHitbox.y + obstacleHitbox.height &&
          surferHitbox.y + surferHitbox.height > obstacleHitbox.y
        ) {
          playSound(120, 0.4, 'sawtooth', 40);
          gameRunning = false;

          if (Math.floor(distance) > highScore) {
            highScore = Math.floor(distance);
            localStorage.setItem('surf_high_score', highScore);
          }
          break;
        }

        if (obs.x < -30) {
          obstacles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#020b14');
      gradient.addColorStop(0.6, '#083344');
      gradient.addColorStop(1, '#00f2fe');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ffee00';
      ctx.beginPath();
      ctx.arc(260, 60, 20, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0088cc';
      ctx.fillRect(0, WATER_LEVEL + 8, canvas.width, canvas.height - WATER_LEVEL);

      ctx.strokeStyle = '#00f2fe';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, WATER_LEVEL + 8);
      for (let x = 0; x <= canvas.width; x += 20) {
        const waveY = Math.sin((x + frameCount * 4) * 0.05) * 3;
        ctx.lineTo(x, WATER_LEVEL + 8 + waveY);
      }
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      foamParticles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      obstacles.forEach(obs => {
        ctx.fillText(obs.type, obs.x, obs.y);
      });

      ctx.font = '26px sans-serif';
      ctx.textAlign = 'center';
      
      let surferSprite = '🏄‍♂️';
      let renderY = surfer.y;

      if (surfer.isDucking) {
        surferSprite = '🏄';
        renderY += 6;
      }

      ctx.fillText(surferSprite, surfer.x, renderY);

      ctx.fillStyle = '#00f2fe';
      ctx.font = '12px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`DIST: ${Math.floor(distance)}m`, 10, 20);

      ctx.textAlign = 'right';
      ctx.fillText(`HI: ${highScore}m`, canvas.width - 10, 20);

      if (!gameRunning && distance > 0) {
        ctx.fillStyle = 'rgba(2, 11, 20, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#00f2fe';
        ctx.font = '16px monospace';
        ctx.textAlign = 'center';
        ctx.fillText("¡CAÍSTE AL AGUA!", canvas.width / 2, canvas.height / 2 - 10);

        ctx.fillStyle = '#ffee00';
        ctx.font = '12px monospace';
        ctx.fillText(`RECORRIDO: ${Math.floor(distance)}m`, canvas.width / 2, canvas.height / 2 + 15);
        ctx.fillText("TOCA LA PANTALLA O BOTÓN A", canvas.width / 2, canvas.height / 2 + 35);
      }
    }

    function drawInitialScreen() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00f2fe';
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText("PRESIONA EL BOTÓN A O TOCA", canvas.width / 2, canvas.height / 2 - 15);
      ctx.fillText("LA PANTALLA PARA EMPEZAR", canvas.width / 2, canvas.height / 2 + 5);

      ctx.fillStyle = '#ffee00';
      ctx.fillText("BOTÓN A: SALTAR | BOTÓN B: AGACHARSE", canvas.width / 2, canvas.height / 2 + 35);
    }

    function gameLoop() {
      if (!gameRunning) return;
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    drawInitialScreen();
  </script>
</body>
</html>
