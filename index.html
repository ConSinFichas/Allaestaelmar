<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Con Sin Fichas - Arcade Collection</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0a0a0f; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .gb-shell { background: #8b0000; width: 360px; height: 680px; border-radius: 20px 20px 50px 20px; padding: 20px; box-shadow: 0 0 30px rgba(255,0,0,0.3), inset -5px -5px 15px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; position: relative; border: 4px solid #550000; }
        .gb-screen-frame { background: #222; width: 100%; height: 320px; border-radius: 10px 10px 30px 10px; padding: 15px; display: flex; flex-direction: column; align-items: center; box-shadow: inset 3px 3px 10px #000; position: relative; }
        .gb-screen { background: #0f1410; width: 100%; height: 100%; border-radius: 5px; border: 2px solid #333; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        canvas { background: #0f1410; width: 100%; height: 100%; display: block; }
        .crt-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; pointer-events: none; }
        .controls { width: 100%; margin-top: 25px; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
        .dpad { width: 120px; height: 120px; position: relative; }
        .dbtn { position: absolute; background: #333; border: 2px solid #111; box-shadow: 2px 2px 0 #000; cursor: pointer; }
        .dbtn:active { background: #555; }
        .d-up { top: 0; left: 40px; width: 40px; height: 45px; border-radius: 5px 5px 0 0; }
        .d-down { bottom: 0; left: 40px; width: 40px; height: 45px; border-radius: 0 0 5px 5px; }
        .d-left { top: 40px; left: 0; width: 45px; height: 40px; border-radius: 5px 0 0 5px; }
        .d-right { top: 40px; right: 0; width: 45px; height: 40px; border-radius: 0 5px 5px 0; }
        .d-center { top: 40px; left: 40px; width: 40px; height: 40px; background: #333; position: absolute; }
        .action-btns { display: flex; gap: 15px; transform: rotate(-15deg); margin-top: 20px; }
        .abtn { width: 55px; height: 55px; background: #a00; border-radius: 50%; border: 3px solid #500; color: #fff; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 0 #000; cursor: pointer; }
        .abtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
        .brand { color: #d00000; font-weight: bold; font-size: 14px; margin-top: 15px; text-shadow: 1px 1px 0 #000; letter-spacing: 2px; }
        .selector { margin-bottom: 10px; display: flex; gap: 5px; }
        .s-btn { background: #222; color: #00ffcc; border: 1px solid #00ffcc; padding: 4px 8px; font-size: 10px; cursor: pointer; border-radius: 3px; }
        .s-btn.active { background: #00ffcc; color: #000; }
    </style>
</head>
<body>

    <div class="selector">
        <button class="s-btn" id="s1" onclick="switchGame('space')">1. Space</button>
        <button class="s-btn" id="s2" onclick="switchGame('galaxian')">2. Galaxian</button>
        <button class="s-btn" id="s3" onclick="switchGame('surf')">3. Surf</button>
        <button class="s-btn" id="s4" onclick="switchGame('racer')">4. Racer</button>
    </div>

    <div class="gb-shell">
        <div class="gb-screen-frame">
            <div class="gb-screen">
                <canvas id="arcadeCanvas" width="280" height="240"></canvas>
                <div class="crt-overlay"></div>
            </div>
        </div>
        <div class="brand">CON SIN FICHAS</div>
        <div class="controls">
            <div class="dpad">
                <div class="d-center"></div>
                <div class="dbtn d-up" id="btnUp"></div>
                <div class="dbtn d-down" id="btnDown"></div>
                <div class="dbtn d-left" id="btnLeft"></div>
                <div class="dbtn d-right" id="btnRight"></div>
            </div>
            <div class="action-btns">
                <div class="abtn" id="btnB">B</div>
                <div class="abtn" id="btnA">A</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('arcadeCanvas');
        const ctx = canvas.getContext('2d');
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id') || '1';

        // Sistema de Sonido Web Audio API Sintetizado
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSound(freq, type = 'square', duration = 0.1) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // Sistema de Teclado y Touch
        const keys = { left: false, right: false, up: false, down: false, a: false, b: false };

        function bindBtn(id, key) {
            const el = document.getElementById(id);
            if (!el) return;
            const start = (e) => { e.preventDefault(); initAudio(); keys[key] = true; };
            const end = (e) => { e.preventDefault(); keys[key] = false; };
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
        }

        bindBtn('btnLeft', 'left');
        bindBtn('btnRight', 'right');
        bindBtn('btnUp', 'up');
        bindBtn('btnDown', 'down');
        bindBtn('btnA', 'a');
        bindBtn('btnB', 'b');

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === ' ' || e.key === 'z') keys.a = true;
            if (e.key === 'x') keys.b = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === ' ' || e.key === 'z') keys.a = false;
            if (e.key === 'x') keys.b = false;
        });

        // Variables Globales de Juego
        let activeGame = 'space';
        let score = 0;
        let fuel = 100;
        let gameOver = false;
        let frame = 0;

        let p = { x: 130, y: 180, w: 20, h: 20, speed: 0, vy: 0, jumping: false, ducking: false };
        let bullets = [];
        let enemies = [];
        let items = [];

        function setGameMode(mode) {
            activeGame = mode;
            document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('active'));
            if(mode === 'space') document.getElementById('s1').classList.add('active');
            if(mode === 'galaxian') document.getElementById('s2').classList.add('active');
            if(mode === 'surf') document.getElementById('s3').classList.add('active');
            if(mode === 'racer') document.getElementById('s4').classList.add('active');
            resetState();
        }

        function switchGame(mode) { setGameMode(mode); }

        function resetState() {
            score = 0;
            fuel = 100;
            gameOver = false;
            frame = 0;
            bullets = [];
            enemies = [];
            items = [];
            p = { x: 130, y: 180, w: 22, h: 22, speed: 0, vy: 0, jumping: false, ducking: false };
            if (activeGame === 'surf') { p.x = 40; p.y = 170; p.w = 25; p.h = 18; }
            if (activeGame === 'racer') { p.x = 130; p.y = 180; p.w = 18; p.h = 30; }
        }

        if (cardId === '2') setGameMode('galaxian');
        else if (cardId === '3') setGameMode('surf');
        else if (cardId === '4') setGameMode('racer');
        else setGameMode('space');

        // Renderizado de Emojis / Sprites Detallados
        function drawSprite(symbol, x, y, size = 20) {
            ctx.font = `${size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(symbol, x + size/2, y + size/2);
        }

        // Bucle Principal
        function gameLoop() {
            frame++;
            ctx.fillStyle = '#0f1410';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameOver) {
                ctx.fillStyle = '#ff0055';
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', 140, 110);
                ctx.fillStyle = '#00ffcc';
                ctx.font = '10px monospace';
                ctx.fillText('Presiona A para reiniciar', 140, 140);
                if (keys.a) resetState();
                requestAnimationFrame(gameLoop);
                return;
            }

            // 1. SPACE DODGER (Nave, Meteoros y Fichas)
            if (activeGame === 'space') {
                if (keys.left && p.x > 5) p.x -= 3;
                if (keys.right && p.x < canvas.width - 25) p.x += 3;
                if (keys.up && p.y > 20) p.y -= 3;
                if (keys.down && p.y < canvas.height - 25) p.y += 3;

                if (keys.a && frame % 10 === 0) {
                    bullets.push({ x: p.x + 8, y: p.y, w: 4, h: 8 });
                    playSound(600, 'square', 0.05);
                }

                if (frame % 35 === 0) {
                    let isItem = Math.random() < 0.3;
                    if(isItem) items.push({ x: 10 + Math.random() * 240, y: -20, symbol: '🪙' });
                    else enemies.push({ x: 10 + Math.random() * 240, y: -20, vy: 2, symbol: '☄️' });
                }

                // Nave
                drawSprite('🚀', p.x, p.y, 22);

                // Disparos
                ctx.fillStyle = '#00ffcc';
                bullets.forEach((b, bi) => {
                    b.y -= 6;
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    if (b.y < -10) bullets.splice(bi, 1);
                });

                // Items (Fichas)
                items.forEach((it, ii) => {
                    it.y += 1.5;
                    drawSprite(it.symbol, it.x, it.y, 18);
                    if (Math.hypot(p.x - it.x, p.y - it.y) < 20) {
                        items.splice(ii, 1);
                        score += 20;
                        playSound(880, 'sine', 0.1);
                    }
                    if (it.y > 250) items.splice(ii, 1);
                });

                // Meteoros
                enemies.forEach((e, ei) => {
                    e.y += e.vy;
                    drawSprite(e.symbol, e.x, e.y, 22);

                    if (Math.hypot(p.x - e.x, p.y - e.y) < 18) {
                        gameOver = true;
                        playSound(150, 'sawtooth', 0.3);
                    }

                    bullets.forEach((b, bi) => {
                        if (Math.hypot(b.x - e.x, b.y - e.y) < 18) {
                            enemies.splice(ei, 1);
                            bullets.splice(bi, 1);
                            score += 10;
                            playSound(300, 'square', 0.08);
                        }
                    });

                    if (e.y > 250) enemies.splice(ei, 1);
                });
            }

            // 2. GALAXIAN DISCO ROCK (Bailarín, Notas y Bolas de Disco)
            else if (activeGame === 'galaxian') {
                if (keys.left && p.x > 5) p.x -= 3;
                if (keys.right && p.x < canvas.width - 25) p.x += 3;

                if (keys.a && frame % 12 === 0) {
                    bullets.push({ x: p.x + 6, y: p.y, symbol: '🎶' });
                    playSound(523, 'sine', 0.08);
                }

                if (frame % 45 === 0) {
                    enemies.push({ x: 10 + Math.random() * 240, y: -20, vy: 1.5, symbol: '🪩' });
                }

                // Jugador
                drawSprite('🕺', p.x, p.y, 24);

                // Notas
                bullets.forEach((b, bi) => {
                    b.y -= 5;
                    drawSprite(b.symbol, b.x, b.y, 14);
                    if (b.y < -10) bullets.splice(bi, 1);
                });

                // Bolas de disco
                enemies.forEach((e, ei) => {
                    e.y += e.vy;
                    drawSprite(e.symbol, e.x, e.y, 22);

                    if (Math.hypot(p.x - e.x, p.y - e.y) < 18) {
                        gameOver = true;
                        playSound(120, 'sawtooth', 0.3);
                    }

                    bullets.forEach((b, bi) => {
                        if (Math.hypot(b.x - e.x, b.y - e.y) < 18) {
                            enemies.splice(ei, 1);
                            bullets.splice(bi, 1);
                            score += 15;
                            playSound(784, 'triangle', 0.1);
                        }
                    });

                    if (e.y > 250) enemies.splice(ei, 1);
                });
            }

            // 3. SURF RUNNER (Surfista, Olas, Tiburones, Arrecifes y Gaviotas)
            else if (activeGame === 'surf') {
                p.ducking = keys.down || keys.b;

                if ((keys.a || keys.up) && !p.jumping) {
                    p.vy = -7.5;
                    p.jumping = true;
                    playSound(400, 'square', 0.1);
                }

                p.y += p.vy;
                p.vy += 0.45; // Gravedad

                if (p.y >= 165) {
                    p.y = 165;
                    p.vy = 0;
                    p.jumping = false;
                }

                // Generación de Obstáculos
                if (frame % 75 === 0) {
                    let r = Math.random();
                    if(r < 0.4) enemies.push({ x: 280, y: 168, symbol: '🦈', high: false });
                    else if(r < 0.7) enemies.push({ x: 280, y: 168, symbol: '🪨', high: false });
                    else enemies.push({ x: 280, y: 135, symbol: '🐦', high: true });
                }

                // Océano
                ctx.fillStyle = '#0044cc';
                ctx.fillRect(0, 185, 280, 55);
                ctx.fillStyle = '#00aaff';
                let waveOffset = (frame * 2) % 20;
                for(let wx = -20; wx < 300; wx += 20) {
                    ctx.beginPath();
                    ctx.arc(wx + waveOffset, 185, 10, 0, Math.PI);
                    ctx.fill();
                }

                // Surfista
                drawSprite(p.ducking ? '🏄‍♂️' : '🏄', p.x, p.ducking ? p.y + 8 : p.y, 24);

                // Obstáculos
                enemies.forEach((e, ei) => {
                    e.x -= 3;
                    drawSprite(e.symbol, e.x, e.y, 20);

                    // Colisión ajustada según agachado / salto
                    let hit = false;
                    if (!e.high && Math.hypot(p.x - e.x, p.y - e.y) < 18) hit = true;
                    if (e.high && !p.ducking && Math.hypot(p.x - e.x, p.y - e.y) < 18) hit = true;

                    if (hit) {
                        gameOver = true;
                        playSound(100, 'sawtooth', 0.3);
                    }

                    if (e.x < -20) {
                        enemies.splice(ei, 1);
                        score += 10;
                    }
                });
            }

            // 4. HIGHWAY RACER (Autos, Baches 🕳️, Bidones ⛽, Fichas 🪙 y Límite 45 km/h)
            else if (activeGame === 'racer') {
                if (keys.up || keys.a) {
                    if (p.speed < 2.5) p.speed += 0.04; // Max ~45 km/h
                } else if (keys.down || keys.b) {
                    if (p.speed > 0) p.speed -= 0.08;
                } else {
                    if (p.speed > 0) p.speed -= 0.015;
                }
                if (p.speed < 0) p.speed = 0;

                // Dirección suave dentro del asfalto
                if (keys.left && p.x > 55) p.x -= 2.2;
                if (keys.right && p.x < 205) p.x += 2.2;

                // Asfalto
                ctx.fillStyle = '#222';
                ctx.fillRect(50, 0, 180, 240);
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(48, 0, 3, 240);
                ctx.fillRect(229, 0, 3, 240);

                // Línea discontinua
                ctx.fillStyle = '#fff';
                let lineOffset = (frame * p.speed * 4) % 40;
                for (let y = -40; y < 240; y += 40) {
                    ctx.fillRect(138, y + lineOffset, 4, 20);
                }

                // Spawn bajo tráfico y baches
                if (frame % 85 === 0 && enemies.length < 2) {
                    let r = Math.random();
                    if(r < 0.4) enemies.push({ x: 65 + Math.random() * 130, y: -30, symbol: '🚘', type: 'car' });
                    else if(r < 0.7) enemies.push({ x: 65 + Math.random() * 130, y: -30, symbol: '🕳️', type: 'pothole' });
                    else items.push({ x: 65 + Math.random() * 130, y: -30, symbol: Math.random() < 0.5 ? '⛽' : '🪙' });
                }

                // Auto del Jugador
                drawSprite('🏎️', p.x, p.y, 24);

                // Items (Combustible / Fichas)
                items.forEach((it, ii) => {
                    it.y += 1 + p.speed;
                    drawSprite(it.symbol, it.x, it.y, 18);
                    if (Math.hypot(p.x - it.x, p.y - it.y) < 18) {
                        items.splice(ii, 1);
                        if(it.symbol === '⛽') fuel = Math.min(100, fuel + 25);
                        else score += 30;
                        playSound(659, 'sine', 0.1);
                    }
                    if (it.y > 250) items.splice(ii, 1);
                });

                // Obstáculos
                enemies.forEach((e, ei) => {
                    e.y += (e.type === 'pothole' ? 1 : 0.4) + p.speed;
                    drawSprite(e.symbol, e.x, e.y, 22);

                    if (Math.hypot(p.x - e.x, p.y - e.y) < 18) {
                        if (e.type === 'pothole') {
                            enemies.splice(ei, 1);
                            fuel -= 20;
                            p.speed *= 0.5;
                            playSound(120, 'square', 0.2);
                        } else {
                            gameOver = true;
                            playSound(90, 'sawtooth', 0.4);
                        }
                    }

                    if (e.y > 250) {
                        enemies.splice(ei, 1);
                        score += 5;
                    }
                });

                // Consumo de Combustible
                if (p.speed > 0 && frame % 30 === 0) fuel -= 0.5;
                if (fuel <= 0) gameOver = true;
            }

            // HUD Principal
            ctx.fillStyle = '#00ffcc';
            ctx.font = '10px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('SCORE:' + score, 8, 15);
            if (activeGame === 'racer') {
                let speedKmh = Math.round(p.speed * 18);
                ctx.fillText(`${speedKmh}KM/H`, 115, 15);
                ctx.fillText(`GAS:${Math.round(fuel)}%`, 210, 15);
            } else {
                ctx.fillText('CARD:#' + cardId, 210, 15);
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
