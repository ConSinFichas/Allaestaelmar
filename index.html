<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Con Sin Fichas - Arcade Collection</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0a0a0f; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .gb-shell { background: #8b0000; width: 360px; height: 680px; border-radius: 20px 20px 50px 20px; padding: 20px; box-shadow: 0 0 30px rgba(255,0,0,0.3), inset -5px -5px 15px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; position: relative; border: 4px solid #550000; }
        .gb-screen-frame { background: #222; width: 100%; height: 320px; border-radius: 10px 10px 30px 10px; padding: 15px; display: flex; flex-direction: column; align-items: center; box-shadow: inset 3px 3px 10px #000; position: relative; }
        .gb-screen { background: #0f1410; width: 100%; height: 100%; border-radius: 5px; border: 2px solid #333; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        canvas { background: #0f1410; width: 100%; height: 100%; display: block; }
        .crt-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; pointer-events: none; }
        .controls { width: 100%; margin-top: 25px; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
        .dpad { width: 120px; height: 120px; position: relative; }
        .dbtn { position: absolute; background: #333; border: 2px solid #111; box-shadow: 2px 2px 0 #000; cursor: pointer; }
        .dbtn:active { background: #555; }
        .d-up { top: 0; left: 40px; width: 40px; height: 45px; border-radius: 5px 5px 0 0; }
        .d-down { bottom: 0; left: 40px; width: 40px; height: 45px; border-radius: 0 0 5px 5px; }
        .d-left { top: 40px; left: 0; width: 45px; height: 40px; border-radius: 5px 0 0 5px; }
        .d-right { top: 40px; right: 0; width: 45px; height: 40px; border-radius: 0 5px 5px 0; }
        .d-center { top: 40px; left: 40px; width: 40px; height: 40px; background: #333; position: absolute; }
        .action-btns { display: flex; gap: 15px; transform: rotate(-15deg); margin-top: 20px; }
        .abtn { width: 55px; height: 55px; background: #a00; border-radius: 50%; border: 3px solid #500; color: #fff; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 0 #000; cursor: pointer; }
        .abtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
        .brand { color: #d00000; font-weight: bold; font-size: 14px; margin-top: 15px; text-shadow: 1px 1px 0 #000; letter-spacing: 2px; }
        .selector { margin-bottom: 10px; display: flex; gap: 5px; }
        .s-btn { background: #222; color: #00ffcc; border: 1px solid #00ffcc; padding: 4px 8px; font-size: 10px; cursor: pointer; border-radius: 3px; }
        .s-btn.active { background: #00ffcc; color: #000; }
    </style>
</head>
<body>

    <div class="selector">
        <button class="s-btn" id="s1" onclick="switchGame('space')">1. Space</button>
        <button class="s-btn" id="s2" onclick="switchGame('galaxian')">2. Galaxian</button>
        <button class="s-btn" id="s3" onclick="switchGame('surf')">3. Surf</button>
        <button class="s-btn" id="s4" onclick="switchGame('racer')">4. Racer</button>
    </div>

    <div class="gb-shell">
        <div class="gb-screen-frame">
            <div class="gb-screen">
                <canvas id="arcadeCanvas" width="280" height="240"></canvas>
                <div class="crt-overlay"></div>
            </div>
        </div>
        <div class="brand">CON SIN FICHAS</div>
        <div class="controls">
            <div class="dpad">
                <div class="d-center"></div>
                <div class="dbtn d-up" id="btnUp"></div>
                <div class="dbtn d-down" id="btnDown"></div>
                <div class="dbtn d-left" id="btnLeft"></div>
                <div class="dbtn d-right" id="btnRight"></div>
            </div>
            <div class="action-btns">
                <div class="abtn" id="btnB">B</div>
                <div class="abtn" id="btnA">A</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('arcadeCanvas');
        const ctx = canvas.getContext('2d');
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id') || '1';

        // Sistema de Teclado y Touch Input
        const keys = { left: false, right: false, up: false, down: false, a: false, b: false };

        function bindBtn(id, key) {
            const el = document.getElementById(id);
            if (!el) return;
            const start = (e) => { e.preventDefault(); keys[key] = true; };
            const end = (e) => { e.preventDefault(); keys[key] = false; };
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
        }

        bindBtn('btnLeft', 'left');
        bindBtn('btnRight', 'right');
        bindBtn('btnUp', 'up');
        bindBtn('btnDown', 'down');
        bindBtn('btnA', 'a');
        bindBtn('btnB', 'b');

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === ' ' || e.key === 'z') keys.a = true;
            if (e.key === 'x') keys.b = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === ' ' || e.key === 'z') keys.a = false;
            if (e.key === 'x') keys.b = false;
        });

        // Estado del Juego
        let activeGame = 'space';
        let score = 0;
        let gameOver = false;
        let frame = 0;

        // Entidades
        let p = { x: 130, y: 180, w: 20, h: 20, speed: 3, vy: 0, jumping: false };
        let bullets = [];
        let enemies = [];
        let items = [];

        function setGameMode(mode) {
            activeGame = mode;
            document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('active'));
            if(mode === 'space') document.getElementById('s1').classList.add('active');
            if(mode === 'galaxian') document.getElementById('s2').classList.add('active');
            if(mode === 'surf') document.getElementById('s3').classList.add('active');
            if(mode === 'racer') document.getElementById('s4').classList.add('active');
            resetState();
        }

        function switchGame(mode) {
            setGameMode(mode);
        }

        function resetState() {
            score = 0;
            gameOver = false;
            frame = 0;
            bullets = [];
            enemies = [];
            items = [];
            p = { x: 130, y: 180, w: 20, h: 20, speed: 3, vy: 0, jumping: false };
            if (activeGame === 'surf') { p.x = 30; p.y = 170; }
            if (activeGame === 'racer') { p.x = 130; p.y = 180; p.speed = 0; }
        }

        // Selección Inicial por URL Parameter (?id=X)
        if (cardId === '2') setGameMode('galaxian');
        else if (cardId === '3') setGameMode('surf');
        else if (cardId === '4') setGameMode('racer');
        else setGameMode('space');

        // Bucle Principal de Renderizado (60 FPS)
        function gameLoop() {
            frame++;
            ctx.fillStyle = '#0f1410';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameOver) {
                ctx.fillStyle = '#ff0055';
                ctx.font = '16px monospace';
                ctx.fillText('GAME OVER', 90, 110);
                ctx.fillStyle = '#00ffcc';
                ctx.font = '10px monospace';
                ctx.fillText('Presiona A para reiniciar', 65, 140);
                if (keys.a) resetState();
                requestAnimationFrame(gameLoop);
                return;
            }

            // LÓGICA SPACE DODGER
            if (activeGame === 'space') {
                if (keys.left && p.x > 0) p.x -= p.speed;
                if (keys.right && p.x < canvas.width - p.w) p.x += p.speed;
                if (keys.up && p.y > 0) p.y -= p.speed;
                if (keys.down && p.y < canvas.height - p.h) p.y += p.speed;

                if (keys.a && frame % 10 === 0) {
                    bullets.push({ x: p.x + 8, y: p.y, w: 4, h: 8 });
                }

                if (frame % 40 === 0) {
                    enemies.push({ x: Math.random() * 260, y: -20, w: 18, h: 18, vy: 2 });
                }

                // Render NAVE
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(p.x, p.y, p.w, p.h);

                // Disparos
                ctx.fillStyle = '#ffff00';
                bullets.forEach((b, i) => {
                    b.y -= 5;
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    if (b.y < -10) bullets.splice(i, 1);
                });

                // Enemigos
                ctx.fillStyle = '#ff0055';
                enemies.forEach((e, i) => {
                    e.y += e.vy;
                    ctx.fillRect(e.x, e.y, e.w, e.h);

                    // Colisión Nave-Meteoro
                    if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
                        gameOver = true;
                    }

                    // Colisión Disparo-Meteoro
                    bullets.forEach((b, bi) => {
                        if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                            enemies.splice(i, 1);
                            bullets.splice(bi, 1);
                            score += 10;
                        }
                    });

                    if (e.y > canvas.height + 20) enemies.splice(i, 1);
                });
            }

            // LÓGICA GALAXIAN
            else if (activeGame === 'galaxian') {
                if (keys.left && p.x > 0) p.x -= p.speed;
                if (keys.right && p.x < canvas.width - p.w) p.x += p.speed;

                if (keys.a && frame % 12 === 0) {
                    bullets.push({ x: p.x + 8, y: p.y, w: 4, h: 8 });
                }

                if (frame % 50 === 0) {
                    enemies.push({ x: Math.random() * 240, y: -20, w: 20, h: 20, vy: 1.5 });
                }

                ctx.fillStyle = '#ff00cc';
                ctx.fillRect(p.x, p.y, p.w, p.h);

                ctx.fillStyle = '#00ffcc';
                bullets.forEach((b, i) => {
                    b.y -= 4;
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    if (b.y < -10) bullets.splice(i, 1);
                });

                ctx.fillStyle = '#ffff00';
                enemies.forEach((e, i) => {
                    e.y += e.vy;
                    ctx.fillRect(e.x, e.y, e.w, e.h);

                    if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
                        gameOver = true;
                    }

                    bullets.forEach((b, bi) => {
                        if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                            enemies.splice(i, 1);
                            bullets.splice(bi, 1);
                            score += 15;
                        }
                    });

                    if (e.y > canvas.height + 20) enemies.splice(i, 1);
                });
            }

            // LÓGICA SURF RUNNER
            else if (activeGame === 'surf') {
                if (keys.a && !p.jumping) {
                    p.vy = -8;
                    p.jumping = true;
                }

                p.y += p.vy;
                p.vy += 0.4; // Gravedad

                if (p.y >= 170) {
                    p.y = 170;
                    p.vy = 0;
                    p.jumping = false;
                }

                if (frame % 80 === 0) {
                    enemies.push({ x: 280, y: 175, w: 15, h: 15 });
                }

                // Agua
                ctx.fillStyle = '#0055ff';
                ctx.fillRect(0, 185, 280, 55);

                // Surfista
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(p.x, p.y, p.w, p.h);

                // Tiburones / Obstáculos
                ctx.fillStyle = '#ff0000';
                enemies.forEach((e, i) => {
                    e.x -= 3;
                    ctx.fillRect(e.x, e.y, e.w, e.h);

                    if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
                        gameOver = true;
                    }

                    if (e.x < -20) {
                        enemies.splice(i, 1);
                        score += 5;
                    }
                });
            }

            // LÓGICA HIGHWAY RACER (Max 45 km/h, Baches y Potholes)
            else if (activeGame === 'racer') {
                if (keys.up || keys.a) {
                    if (p.speed < 3) p.speed += 0.05; // Cap ~45 km/h
                } else if (keys.down || keys.b) {
                    if (p.speed > 0) p.speed -= 0.1;
                } else {
                    if (p.speed > 0) p.speed -= 0.02; // Desaceleración
                }
                if (p.speed < 0) p.speed = 0;

                // Controles de dirección precisos (sin atascarse)
                if (keys.left && p.x > 45) p.x -= 2.5;
                if (keys.right && p.x < 215) p.x += 2.5;

                // Dibujar Carretera
                ctx.fillStyle = '#333';
                ctx.fillRect(40, 0, 200, 240);
                ctx.fillStyle = '#fff';
                ctx.fillRect(40, 0, 4, 240);
                ctx.fillRect(236, 0, 4, 240);

                // Línea discontinua
                ctx.fillStyle = '#ffff00';
                let lineOffset = (frame * p.speed * 4) % 40;
                for (let y = -40; y < 240; y += 40) {
                    ctx.fillRect(138, y + lineOffset, 4, 20);
                }

                // Generar Tráfico / Baches (Máximo 2 simultáneos)
                if (frame % 90 === 0 && enemies.length < 2) {
                    let isPothole = Math.random() > 0.5;
                    enemies.push({
                        x: 55 + Math.random() * 150,
                        y: -30,
                        w: isPothole ? 16 : 20,
                        h: isPothole ? 10 : 25,
                        type: isPothole ? 'pothole' : 'car'
                    });
                }

                // Auto Jugador
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(p.x, p.y, p.w, p.h);

                // Obstáculos
                enemies.forEach((e, i) => {
                    e.y += (e.type === 'pothole' ? 1 : 0.5) + p.speed;

                    if (e.type === 'pothole') {
                        ctx.fillStyle = '#000'; // Baches (🕳️)
                        ctx.beginPath();
                        ctx.ellipse(e.x + 8, e.y + 5, 8, 5, 0, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = '#ff0055'; // Autos
                        ctx.fillRect(e.x, e.y, e.w, e.h);
                    }

                    // Colisión
                    if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
                        gameOver = true;
                    }

                    if (e.y > canvas.height + 30) {
                        enemies.splice(i, 1);
                        score += 10;
                    }
                });
            }

            // HUD
            ctx.fillStyle = '#00ffcc';
            ctx.font = '10px monospace';
            ctx.fillText('SCORE: ' + score, 10, 15);
            ctx.fillText('CARD: #' + cardId, 210, 15);

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
