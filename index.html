<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Con Sin Fichas - Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #121212; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }
    .gameboy { background: #8b0000; border: 4px solid #4a0000; border-radius: 20px 20px 40px 20px; padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.7); }
    .screen-container { background: #9ea771; border: 4px solid #2d3319; border-radius: 10px; padding: 10px; position: relative; overflow: hidden; height: 210px; display: flex; flex-direction: column; justify-content: space-between; }
    canvas { background: #9ea771; display: block; width: 100%; height: 150px; border: 2px solid #2d3319; image-rendering: pixelated; }
    .hud { display: flex; justify-content: space-between; font-weight: bold; color: #0f380f; font-size: 14px; height: 20px; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 0 10px; }
    .dpad { display: grid; grid-template-columns: repeat(3, 35px); grid-template-rows: repeat(3, 35px); gap: 2px; }
    .dbtn { background: #222; border: none; border-radius: 4px; cursor: pointer; }
    .dbtn:active { background: #444; }
    .btn-action { width: 50px; height: 50px; border-radius: 50%; border: none; background: #b81414; color: white; font-weight: bold; font-size: 16px; box-shadow: 0 4px #660000; cursor: pointer; }
    .btn-action:active { transform: translateY(4px); box-shadow: 0 0 #660000; }
    .btn-group { display: flex; gap: 15px; }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 56, 15, 0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 10; color: #9ea771; padding: 20px; cursor: pointer; }
    .overlay h2 { font-size: 16px; margin-bottom: 10px; text-shadow: 2px 2px #000; }
    .overlay p { font-size: 11px; line-height: 1.4; }
  </style>
</head>
<body>

<div class="gameboy">
  <div class="screen-container" id="screenContainer">
    <!-- Pantalla inicial de toque para activar audio y juego -->
    <div class="overlay" id="startOverlay">
      <h2>CON SIN FICHAS</h2>
      <p>TOCA AQUÍ PARA INICIAR<br><br><b>A:</b> Saltar<br><b>B:</b> Agacharse</p>
    </div>
    <div class="hud">
      <span>DIST: <span id="dist">0</span>m</span>
      <span>HI: <span id="high">0</span>m</span>
    </div>
    <canvas id="game" width="320" height="150"></canvas>
  </div>
  <div class="controls">
    <div class="dpad">
      <div></div><button class="dbtn" id="btnUp"></button><div></div>
      <button class="dbtn" id="btnLeft"></button><div></div><button class="dbtn" id="btnRight"></button>
      <div></div><button class="dbtn" id="btnDown"></button><div></div>
    </div>
    <div class="btn-group">
      <button class="btn-action" id="btnB">B</button>
      <button class="btn-action" id="btnA">A</button>
    </div>
  </div>
</div>

<script>
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// Generador simple de efectos chiptune
function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  let now = audioCtx.currentTime;
  if (type === 'jump') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.15);
    osc.start(now);
    osc.stop(now + 0.15);
  } else if (type === 'hit') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.linearRampToValueAtTime(40, now + 0.3);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  }
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const distEl = document.getElementById('dist');
const highEl = document.getElementById('high');
const startOverlay = document.getElementById('startOverlay');

let distance = 0;
let highScore = localStorage.getItem('surf_hi') || 0;
highEl.textContent = highScore;

let gameOver = false;
let gameRunning = false;
let gameSpeed = 3;

const player = {
  x: 30, y: 100, w: 20, h: 30, vy: 0, gravity: 0.6, isJumping: false, isDucking: false, groundY: 100
};

let obstacles = [];
let spawnTimer = 0;

function jump() {
  if (!gameRunning) return;
  if (gameOver) { resetGame(); return; }
  if (!player.isJumping) {
    player.vy = -10;
    player.isJumping = true;
    player.isDucking = false;
    playSound('jump');
  }
}

function duck(state) {
  if (!gameRunning || gameOver) return;
  if (!player.isJumping) {
    player.isDucking = state;
  } else if (state) {
    player.vy += 5; // Caída rápida al presionar B en el aire
  }
}

function resetGame() {
  distance = 0;
  gameSpeed = 3;
  obstacles = [];
  gameOver = false;
  player.y = player.groundY;
  player.vy = 0;
  player.isJumping = false;
  player.isDucking = false;
}

function spawnObstacle() {
  const isHigh = Math.random() > 0.6;
  obstacles.push({
    x: canvas.width + 20,
    y: isHigh ? 65 : 105,
    w: isHigh ? 22 : 18,
    h: isHigh ? 15 : 25,
    type: isHigh ? '🐦' : (Math.random() > 0.5 ? '🦈' : '🪨')
  });
}

function update() {
  if (!gameRunning || gameOver) return;
  distance += 0.1;
  gameSpeed = 3 + Math.floor(distance / 50) * 0.4;
  distEl.textContent = Math.floor(distance);

  player.vy += player.gravity;
  player.y += player.vy;

  if (player.y >= player.groundY) {
    player.y = player.groundY;
    player.vy = 0;
    player.isJumping = false;
  }

  spawnTimer++;
  if (spawnTimer > 90 / (gameSpeed / 3)) {
    spawnObstacle();
    spawnTimer = 0;
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.x -= gameSpeed;

    let py = player.isDucking ? player.y + 15 : player.y;
    let ph = player.isDucking ? 15 : player.h;

    if (player.x < obs.x + obs.w && player.x + player.w > obs.x && py < obs.y + obs.h && py + ph > obs.y) {
      gameOver = true;
      playSound('hit');
      if (Math.floor(distance) > highScore) {
        highScore = Math.floor(distance);
        localStorage.setItem('surf_hi', highScore);
        highEl.textContent = highScore;
      }
    }

    if (obs.x < -30) obstacles.splice(i, 1);
  }
}

function draw() {
  ctx.fillStyle = '#9ea771';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Piso / Océano
  ctx.fillStyle = '#0f380f';
  ctx.fillRect(0, 125, canvas.width, 25);

  // Dibujar Jugador
  ctx.font = '20px serif';
  ctx.fillText('🏄', player.x, player.isDucking ? player.y + 24 : player.y + 20);

  // Dibujar Obstáculos
  obstacles.forEach(obs => {
    ctx.fillText(obs.type, obs.x, obs.y + 18);
  });

  if (gameOver) {
    ctx.fillStyle = 'rgba(15, 56, 15, 0.85)';
    ctx.fillRect(30, 40, 260, 70);
    ctx.fillStyle = '#9ea771';
    ctx.font = '13px monospace';
    ctx.fillText('¡WIPEOUT! (GAME OVER)', 55, 65);
    ctx.fillText('Presiona A para reintentar', 55, 90);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Evento para arrancar el juego y destrabar el audio
startOverlay.addEventListener('click', () => {
  initAudio();
  startOverlay.style.display = 'none';
  gameRunning = true;
});

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jump();
  if (e.key === 'ArrowDown' || e.key === 's') duck(true);
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowDown' || e.key === 's') duck(false);
});

document.getElementById('btnA').onclick = jump;
document.getElementById('btnB').onmousedown = () => duck(true);
document.getElementById('btnB').onmouseup = () => duck(false);

loop();
</script>
</body>
</html>
